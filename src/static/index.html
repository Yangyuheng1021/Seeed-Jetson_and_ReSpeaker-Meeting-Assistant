<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能会议纪要助手</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --acc:#38bdf8; --ok:#4ade80; --warn:#fbbf24; --err:#f87171; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:#e2e8f0; min-height:100vh; padding:16px; }
  .wrap { max-width:860px; margin:0 auto; }
  h1 { font-size:1.5rem; margin-bottom:4px; }
  .sub { color:#94a3b8; font-size:.85rem; margin-bottom:20px; }
  .card { background:var(--card); border-radius:16px; padding:20px; margin-bottom:16px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  .col { flex:1; min-width:280px; }
  /* 雷达 */
  .radar { width:220px; height:220px; margin:0 auto; position:relative; }
  .radar svg { width:100%; height:100%; }
  .radar .angle-label { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; }
  .angle-num { font-size:2rem; font-weight:700; }
  .angle-dir { color:#94a3b8; font-size:.9rem; }
  /* 按钮 */
  .btn { border:none; border-radius:12px; padding:16px 32px; font-size:1.1rem; font-weight:700; cursor:pointer; color:#fff; width:100%; }
  .btn.start { background:var(--ok); color:#052e16; }
  .btn.stop  { background:var(--err); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .stat { font-size:.95rem; line-height:1.9; }
  .stat b { color:var(--acc); }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:.8rem; margin-left:8px; }
  .badge.rec  { background:rgba(248,113,113,.2); color:var(--err); }
  .badge.proc { background:rgba(56,189,248,.2); color:var(--acc); }
  .badge.idle { background:rgba(148,163,184,.2); color:#94a3b8; }
  .progress { margin-top:12px; color:var(--warn); font-size:.9rem; }
  .err { margin-top:12px; color:var(--err); font-size:.9rem; }
  /* 会议列表 */
  .meeting-item { padding:10px 4px; border-bottom:1px solid #334155; cursor:pointer; }
  .meeting-item:hover { color:var(--acc); }
  .meeting-item:last-child { border-bottom:none; }
  pre.content { white-space:pre-wrap; word-break:break-word; background:#0b1220; border-radius:12px; padding:16px; font-size:.9rem; line-height:1.7; max-height:70vh; overflow:auto; }
  .hidden { display:none; }
  .hint { color:#64748b; font-size:.8rem; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎙️ 智能会议纪要助手</h1>
  <div class="sub">Jetson Orin Nano · reSpeaker Flex 定向拾音 · Whisper 转写 · LLM 摘要</div>

  <!-- 控制卡片 -->
  <div class="card row">
    <div class="col">
      <button id="btn" class="btn start" onclick="toggle()">▶ 开始会议</button>
      <div class="progress hidden" id="progress"></div>
      <div class="err hidden" id="err"></div>
    </div>
    <div class="col stat" id="stat">
      状态：<b id="s-status">空闲</b><span class="badge idle" id="s-badge">idle</span><br>
      会议时长：<b id="s-elapsed">--</b><br>
      语音累计：<b id="s-speech">--</b><br>
      连续静音：<b id="s-silence">--</b>（60 秒自动结束）
    </div>
  </div>

  <!-- 方向雷达 -->
  <div class="card">
    <div class="radar">
      <svg viewBox="0 0 220 220">
        <circle cx="110" cy="110" r="100" fill="none" stroke="#334155" stroke-width="1"/>
        <circle cx="110" cy="110" r="70"  fill="none" stroke="#334155" stroke-width="1"/>
        <circle cx="110" cy="110" r="40"  fill="none" stroke="#334155" stroke-width="1"/>
        <line x1="110" y1="10"  x2="110" y2="210" stroke="#334155" stroke-width="1"/>
        <line x1="10"  y1="110" x2="210" y2="110" stroke="#334155" stroke-width="1"/>
        <text x="110" y="22"  text-anchor="middle" fill="#64748b" font-size="11">前 (0°)</text>
        <text x="200" y="114" text-anchor="middle" fill="#64748b" font-size="11">右</text>
        <text x="110" y="208" text-anchor="middle" fill="#64748b" font-size="11">后 (180°)</text>
        <text x="20"  y="114" text-anchor="middle" fill="#64748b" font-size="11">左</text>
        <g id="doa-dot" transform="translate(110,110)">
          <circle cx="0" cy="-90" r="10" fill="none" stroke="#38bdf8" stroke-width="2"/>
          <circle cx="0" cy="-90" r="4"  fill="#38bdf8"/>
        </g>
      </svg>
      <div class="angle-label">
        <div class="angle-num" id="angle-num">--°</div>
        <div class="angle-dir" id="angle-dir">等待会议开始</div>
        <div class="hint" id="speak-hint"></div>
      </div>
    </div>
  </div>

  <!-- 历史纪要 -->
  <div class="card">
    <h2 style="font-size:1.1rem; margin-bottom:10px;">📄 历史会议纪要</h2>
    <div id="meetings"><span style="color:#64748b;">加载中...</span></div>
    <div class="hidden" id="detail">
      <button class="btn start" style="margin:12px 0;" onclick="hideDetail()">← 返回列表</button>
      <pre class="content" id="detail-content"></pre>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let state = {status:"idle"};

function dirName(a){
  const names={0:"正前方",45:"右前方",90:"右侧",135:"右后方",180:"正后方",225:"左后方",270:"左侧",315:"左前方"};
  let best=0, bd=999;
  for(const k in names){const d=Math.abs(((a-+k+180)%360+360)%360-180); if(d<bd){bd=d;best=+k;}}
  return names[best];
}

function render(){
  const s=state;
  $("s-status").textContent = s.status==="recording"?"录音中":s.status==="processing"?"处理中":"空闲";
  $("s-badge").textContent=s.status; $("s-badge").className="badge "+s.status;
  $("s-elapsed").textContent = s.started_at?fmt(s.elapsed):"--";
  $("s-speech").textContent = s.started_at?fmt(s.speech_secs):"--";
  $("s-silence").textContent = s.status==="recording"?s.silence_secs+" 秒":"--";
  $("btn").textContent = s.status==="recording"?"⏹ 结束会议":"▶ 开始会议";
  $("btn").className = "btn "+(s.status==="recording"?"stop":"start");
  $("btn").disabled = s.status==="processing";
  $("progress").classList.toggle("hidden", !s.progress);
  $("progress").textContent = "⚙️ "+s.progress;
  $("err").classList.toggle("hidden", !s.error);
  $("err").textContent = "❌ "+s.error;
  if(s.doa_angle!=null){
    $("doa-dot").setAttribute("transform", `rotate(${s.doa_angle} 110 110)`);
    $("angle-num").textContent = s.doa_angle+"°";
    $("angle-dir").textContent = dirName(s.doa_angle);
    $("speak-hint").textContent = s.speaking?"🔊 有人在说话":"🤫 安静";
    $("speak-hint").style.color = s.speaking?"#4ade80":"#64748b";
  } else if(s.status==="idle"){
    $("doa-dot").setAttribute("transform","rotate(0 110 110)");
    $("angle-num").textContent="--°";
    $("angle-dir").textContent="等待会议开始";
    $("speak-hint").textContent="";
  }
}

const fmt = secs => {
  secs = secs||0;
  const h=Math.floor(secs/3600), m=Math.floor(secs%3600/60), s=Math.floor(secs%60);
  return (h?h+"小时":"")+(m?m+"分":"")+s+"秒";
};

async function toggle(){
  if(state.status==="recording") await api("/api/stop","POST");
  else await api("/api/start","POST");
  refresh();
}

async function api(path, method){
  const r = await fetch(path,{method:method||"GET"});
  return r.json();
}

async function refresh(){
  try{
    state = await api("/api/status");
    render();
    if(state.status!=="recording") loadMeetings();  // 空闲/处理完时刷新列表
  }catch(e){ /* 服务暂时不可达，忽略 */ }
}

async function loadMeetings(){
  try{
    const files = await api("/api/meetings");
    if(!files.length){ $("meetings").innerHTML='<span style="color:#64748b;">还没有会议纪要</span>'; return; }
    $("meetings").innerHTML = files.map(f=>
      `<div class="meeting-item" onclick="showDetail('${f}')">📄 ${f.replace(/^meeting_|\.md$/g,"").replace(/(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})/,"$1-$2-$3 $4:$5:$6")}</div>`
    ).join("");
  }catch(e){}
}

async function showDetail(name){
  try{
    const r = await fetch("/api/meetings/"+name);
    $("detail-content").textContent = await r.text();
    $("detail").classList.remove("hidden");
    $("meetings").classList.add("hidden");
  }catch(e){}
}

function hideDetail(){
  $("detail").classList.add("hidden");
  $("meetings").classList.remove("hidden");
}

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
